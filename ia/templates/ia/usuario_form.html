{% extends "commex/base.html" %}
{% block title %}Cota de IA{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h1 class="h5 mb-0 text-center">Cota de IA: {{ alvo.get_username }}</h1>
            </div>
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.cota_mensal.id_for_label }}" class="form-label fw-semibold">{{ form.cota_mensal.label }}</label>
                        {{ form.cota_mensal }}
                        {% if form.cota_mensal.errors %}<div class="text-danger small mt-1">{{ form.cota_mensal.errors }}</div>{% endif %}
                    </div>
                    <div class="form-check form-switch mb-4">
                        {{ form.permitido }}
                        <label for="{{ form.permitido.id_for_label }}" class="form-check-label fw-semibold">{{ form.permitido.label }}</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Salvar</button>
                        <a class="btn btn-outline-secondary" href="{% url 'ia:usuarios' %}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
