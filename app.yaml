runtime: python312

# Segredos (SECRET_KEY, DATABASE_URL...) ficam em env_variables.yaml, que não é versionado.
# Crie-o a partir de env_variables.yaml.example antes do deploy.
includes:
  - env_variables.yaml

env_variables:
  DEBUG: "0"


entrypoint: gunicorn -b :$PORT --workers 1 --threads 4 naes2026.wsgi

# Substitua "SEUPROJETO" pelo nome do seu projeto Django (o mesmo nome da pasta que tem o arquivo settings.py)


handlers:

- url: /static

  static_dir: static_gcloud/

- url: /.*

  script: auto


automatic_scaling:

  min_instances: 0

  max_instances: 2

