{% load crispy_forms_filters %}
<form method="get" class="card card-body border-0 shadow-sm mb-3">
    <div class="row g-2 align-items-end">
        {% for field in filter.form.visible_fields %}
            <div class="col-md-3">
                <label for="{{ field.id_for_label }}" class="form-label small fw-semibold mb-1">{{ field.label }}</label>
                {{ field|as_crispy_field }}
            </div>
        {% endfor %}
        <div class="col-md-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Filtrar</button>
            <a class="btn btn-outline-secondary" href="{{ request.path }}">Limpar</a>
        </div>
    </div>
</form>
